name: Feature Request
description: Suggest an idea for QueryCraft
title: "[Feature]: "
labels: ["enhancement", "feature-request"]
assignees:
  - arthur
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please help us understand what you'd like to see added.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is
      placeholder: I'm always frustrated when...
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen
      placeholder: I would like to be able to...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered
    validations:
      required: false
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe your specific use case and how this feature would help
      placeholder: |
        In my application, I need to...
        This feature would help by...
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example Implementation
      description: If you have ideas about how this could be implemented, please share
      render: php
      placeholder: |
        <?php
        // Example of how the feature might work
        $query = new ElasticQuery();
        $query->newFeature('parameter');
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would be helpful
        - High - Important for my use case
        - Critical - Blocking my project
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be interested in contributing to implement this feature?
      options:
        - label: I would be willing to contribute to implementing this feature
        - label: I would be willing to help test this feature
        - label: I would be willing to help document this feature
