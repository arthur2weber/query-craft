name: Bug Report
description: File a bug report to help us improve QueryCraft
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - arthur2weber
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A bug happened!"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Please provide step-by-step instructions to reproduce the issue
      placeholder: |
        1. Install the package via composer
        2. Create a new ElasticQuery instance
        3. Call the method...
        4. See error
    validations:
      required: true
  - type: textarea
    id: code-sample
    attributes:
      label: Code Sample
      description: Please provide a minimal code sample that demonstrates the issue        render: php
      placeholder: |
        <?php
        use Arthur2weber\QueryCraft\ElasticQuery;
        
        $query = new ElasticQuery();
        // Your code here that reproduces the issue
    validations:
      required: false
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of QueryCraft are you running?
      options:
        - 1.0.0 (Latest)
        - Development version
        - Other (please specify in description)
    validations:
      required: true
  - type: dropdown
    id: php-version
    attributes:
      label: PHP Version
      description: What version of PHP are you using?
      options:
        - PHP 8.3
        - PHP 8.2
        - PHP 8.1
        - PHP 8.0
        - PHP 7.4 or earlier
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
